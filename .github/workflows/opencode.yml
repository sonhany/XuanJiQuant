name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # 密钥在 Settings -> Secrets and variables -> Actions 中添加
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # 格式 provider/model。OPENCODE_API_KEY 属 OpenCode Zen，必须用 opencode/ 前缀
          # 当前使用免费模型。Zen 免费模型可选：
          #   opencode/big-pickle                     （隐身模型，免费期数据可能用于改进模型）
          #   opencode/mimo-v2.5-free                 （免费期数据可能用于改进模型）
          #   opencode/ling-3.0-flash-fin-free        （免费期数据可能用于改进模型）
          #   opencode/nemotron-3-ultra-free          （NVIDIA 试用端点，会记录使用情况）
          #   opencode/nemotron-3.5-lightning-free    （NVIDIA 试用端点，会记录使用情况）
          #   opencode/muse-spark-1.3-contributor-free（提示词会被用于训练 Meta 模型）
          # 免费额度用尽或需要更强能力时，可换成付费模型：
          #   opencode/claude-sonnet-4-5、opencode/gpt-5.2、opencode/kimi-k3、opencode/glm-5.3
          model: opencode/big-pickle
          # share: true    # 公开仓库默认 true，不希望会话被公开分享则设为 false
          # agent: build   # 可选，默认 build
          # prompt: |      # 可选，覆盖默认行为
          #   ...
          # github_token: xxxx  # 可选，默认使用 opencode-agent App 的安装令牌
