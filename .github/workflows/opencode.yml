name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # 密钥在 Settings -> Secrets and variables -> Actions 中添加
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # 格式 provider/model。OPENCODE_API_KEY 属 OpenCode Zen，必须用 opencode/ 前缀
          # 可选：opencode/claude-sonnet-4-5、opencode/claude-opus-4-5、opencode/gpt-5.2、
          #       opencode/kimi-k3、opencode/glm-5.3、opencode/minimax-m3
          model: opencode/claude-sonnet-4-5
          # share: true    # 公开仓库默认 true，不希望会话被公开分享则设为 false
          # agent: build   # 可选，默认 build
          # prompt: |      # 可选，覆盖默认行为
          #   ...
          # github_token: xxxx  # 可选，默认使用 opencode-agent App 的安装令牌
